
name: Build GFR Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q GFR_Devis_Factures_Android_Projet.zip -d unpacked

      - name: Build APK
        run: |
          cd unpacked/GFR_Devis_Factures_Android
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GFR-Devis-Factures-APK
          path: unpacked/GFR_Devis_Factures_Android/app/build/outputs/apk/debug/app-debug.apk
